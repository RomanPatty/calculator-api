name: Self-hosted Docker Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Docker
        shell: powershell
        run: docker version

      - name: Build Docker image
        shell: powershell
        run: docker build --build-arg APP_VERSION=1.0.${{ github.run_number }} -t calculator-api:1.0.${{ github.run_number }} .