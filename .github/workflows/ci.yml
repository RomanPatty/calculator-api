name: Calculator CI Security

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security:
    name: Build and Security Scan
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        shell: powershell
        run: |
          docker build `
            --build-arg APP_VERSION=1.0.${{ github.run_number }} `
            -t calculator-api:1.0.${{ github.run_number }} `
            .

      - name: Run Semgrep
        shell: powershell
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/src" `
            -w /src `
            semgrep/semgrep:latest `
            semgrep scan --config auto

      - name: Save Docker image
        shell: powershell
        run: |
          docker save `
            calculator-api:1.0.${{ github.run_number }} `
            -o calculator-api.tar

      - name: Run Trivy
        shell: powershell
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/work" `
            aquasec/trivy:0.70.0 `
            image `
            --input /work/calculator-api.tar `
            --ignore-unfixed `
            --severity HIGH,CRITICAL `
            --exit-code 0

      - name: Generate SBOM with Syft
        shell: powershell
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/work" `
            anchore/syft:v1.42.3 `
            scan docker-archive:/work/calculator-api.tar `
            -o spdx-json=/work/sbom.spdx.json

      - name: Scan SBOM with Grype
        shell: powershell
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/work" `
            anchore/grype:v0.110.0 `
            sbom:/work/sbom.spdx.json

      - name: Run Gitleaks
        shell: powershell
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/repo" `
            ghcr.io/gitleaks/gitleaks:v8.24.3 `
            detect `
            --source=/repo `
            --redact `
            --exit-code=0

      - name: Run Checkov
        shell: powershell
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/src" `
            -w /src `
            bridgecrew/checkov:3.3.29 `
            -d . `
            --soft-fail

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json